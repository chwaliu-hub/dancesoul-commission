<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞者抽成系統（協作版）— DanceSoul</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf9; --line:#e3ddcf; --ink:#2e2a24; --muted:#8a8271;
    --accent:#b5651d; --accent-soft:#e9d9c4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  header .sub{color:var(--muted);font-size:13px;}
  nav{display:flex;gap:4px;padding:12px 24px 0;background:var(--bg);flex-wrap:wrap;}
  nav button{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:15px;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;}
  nav button.active{background:var(--panel);color:var(--ink);font-weight:700;border:1px solid var(--line);border-bottom:none;}
  main{padding:20px 24px 60px;max-width:900px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:13px;}
  tr:hover td{background:#faf7f0;}
  input,select,textarea{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:140px;}
  button.primary{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  button.ghost{background:none;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-family:inherit;cursor:pointer;color:var(--ink);}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;padding:2px 6px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  h2{font-size:16px;margin:0 0 14px;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--accent-soft);}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row-v2{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff;}
  .item-row-line1{display:flex;gap:8px;margin-bottom:8px;}
  .item-row-line1 input{flex:1;}
  .item-row-line2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .item-row-line2 select{flex:1;min-width:120px;}
  .item-row-line2 input{flex:1;min-width:80px;}
  .item-row-amt{min-width:90px;text-align:right;font-weight:700;margin-left:auto;}
  .item-row input{flex:1;}
  .modal-bg{position:fixed;inset:0;background:rgba(46,42,36,.4);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px;width:min(520px,92vw);max-height:88vh;overflow:auto;}
  .confirm-box{background:#eef4ea;border:1px solid #c9dcc0;border-radius:10px;padding:16px;margin-bottom:16px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>舞者抽成系統（協作版）</h1>
    <div class="sub">靈動力肢體開發有限公司 · CASE 演出活動</div>
  </div>
  <div class="sub" id="apiStatus">連線中…</div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
// ====== 設定：跟老闆要這兩個值填進來 ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwI8La23JAtb2JIooIXYIln3rPPU38UO59ZyeRKx5-eBZRp_BrY2CdxKKa4ZPcqAYxE9A/exec';
const STAFF_TOKEN = 'dancesoul2026case';

const state = { tab: 'events', dancers: [], events: [] };
let pendingExemptTax = false;
const TABS = [ ['events', '活動報價'], ['dancers', '舞者資料'], ['adddisb', '新增費用明細'] ];

function apiGet(action, params={}) {
  const qs = new URLSearchParams({ action, token: STAFF_TOKEN, ...params }).toString();
  return fetch(`${API_URL}?${qs}`).then(r => r.json()).then(r => {
    if (r.error) throw new Error(r.error);
    return r.data;
  });
}
function apiPost(action, payload) {
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token: STAFF_TOKEN, payload })
  }).then(r => r.json()).then(r => {
    if (r.error) throw new Error(r.error);
    return r.data;
  });
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(([id,label]) =>
    `<button class="${state.tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`
  ).join('');
}
function switchTab(id) { state.tab = id; renderNav(); render(); }
function render() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">載入中…</div>';
  const renderers = { events: renderEvents, dancers: renderDancers, adddisb: renderAddDisb };
  renderers[state.tab]();
}
function money(n){ return (Number(n)||0).toLocaleString('zh-TW'); }
function val(id){ return document.getElementById(id).value; }
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function showErr(err){ console.error(err); alert('發生錯誤：' + err.message); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

// ---------- 活動報價 ----------
function renderEvents() {
  apiGet('staffListEvents').then(list => {
    state.events = list;
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <div class="toolbar"><h2>活動報價（${list.length}）</h2><button class="primary" onclick="openEventForm()">＋ 新增活動</button></div>
        <table>
          <thead><tr><th>日期</th><th>活動名稱</th><th>客戶</th><th>總計</th><th>狀態</th><th></th></tr></thead>
          <tbody>${list.map(e => `
            <tr>
              <td>${e.date||''}</td><td>${e.name}</td><td>${e.client||''}</td>
              <td>$${money(e.total)}</td><td><span class="tag">${e.status}</span></td>
              <td><button class="link" onclick='openEventForm(${JSON.stringify(e)})'>編輯</button>
                  <button class="link" onclick="printQuote('${e.eventId}')">列印報價單</button></td>
            </tr>`).join('') || '<tr><td colspan=6 class="empty">尚無活動</td></tr>'}
          </tbody>
        </table>
      </div>`;
  }).catch(showErr);
}

let editingItems = [];
function openEventForm(e) {
  e = e || {};
  editingItems = (e.items && e.items.length) ? JSON.parse(JSON.stringify(e.items)) : [{label:'',note:'',unitPrice:'',qty:1,extraQty:'',extraLabel:'',amount:0}];
  showModal(`
    <h2>${e.eventId ? '編輯活動' : '新增活動'}</h2>
    <div class="row">
      <div class="field"><label>活動名稱</label><input id="f_name" value="${e.name||''}"></div>
      <div class="field"><label>日期</label><input id="f_date" type="date" value="${e.date||''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>客戶</label><input id="f_client" value="${e.client||''}"></div>
      <div class="field"><label>狀態</label>
        <select id="f_status">${['報價中','已確認','已結案'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
    <label>報價項目（單價 × 人數 × 加乘數量，金額會自動算，也可以直接改金額覆蓋）</label>
    <div id="itemsList"></div>
    <button class="ghost" onclick="addItemRow()">＋ 新增項目</button>
    <div class="row" style="margin-top:12px;">
      <div class="field"><label>折讓</label><input id="f_discount" type="number" value="${e.discount||0}"></div>
      <div class="field"><label>營業稅率（例如 0.05）</label><input id="f_taxRate" type="number" step="0.01" value="0.05"></div>
    </div>
    <div class="field" style="margin-top:8px;">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_isOverseas" style="width:auto;" ${e.isOverseas?'checked':''} onchange="toggleOverseasFields()"> 海外客戶（列印時加上 Invoice# 和人民幣換算）</label>
    </div>
    <div class="row" id="overseasFields" style="display:${e.isOverseas?'flex':'none'};">
      <div class="field"><label>Invoice #</label><input id="f_invoiceNo" value="${e.invoiceNo||''}"></div>
      <div class="field"><label>換算人民幣金額</label><input id="f_rmbAmount" type="number" value="${e.rmbAmount||''}"></div>
    </div>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick='submitEvent(${JSON.stringify(e.eventId||'')})'>儲存</button></div>
  `);
  renderItemsList();
}
function toggleOverseasFields() {
  document.getElementById('overseasFields').style.display = document.getElementById('f_isOverseas').checked ? 'flex' : 'none';
}
function renderItemsList() {
  document.getElementById('itemsList').innerHTML = editingItems.map((it,i) => {
    return `
    <div class="item-row-v2">
      <div class="item-row-line1">
        <input placeholder="項目說明（例如：演出費／排練費）" value="${it.label||''}" oninput="editingItems[${i}].label=this.value">
        <input placeholder="備註（選填）" value="${it.note||''}" oninput="editingItems[${i}].note=this.value">
      </div>
      <div class="item-row-line2">
        <input placeholder="單價" type="number" value="${it.unitPrice ?? ''}" oninput="updateItemAmount(${i}, 'unitPrice', this.value)">
        <span style="color:var(--muted);">×</span>
        <input placeholder="人數" type="number" value="${it.qty ?? 1}" oninput="updateItemAmount(${i}, 'qty', this.value)">
        <span style="color:var(--muted);">×</span>
        <input placeholder="加乘(選填)" type="number" value="${it.extraQty ?? ''}" oninput="updateItemAmount(${i}, 'extraQty', this.value)">
        <input placeholder="單位(如hr/首)" value="${it.extraLabel ?? ''}" style="max-width:100px;" oninput="editingItems[${i}].extraLabel=this.value">
        <span style="color:var(--muted);">=</span>
        <input placeholder="金額" type="number" id="itemAmt_${i}" value="${it.amount||0}" style="font-weight:700;" oninput="editingItems[${i}].amount=Number(this.value)||0">
        <button class="link" onclick="removeItemRow(${i})">✕ 刪除</button>
      </div>
    </div>`;
  }).join('');
}
function updateItemAmount(i, field, value) {
  editingItems[i][field] = value;
  const it = editingItems[i];
  it.amount = (Number(it.unitPrice) || 0) * (Number(it.qty) || 1) * (Number(it.extraQty) || 1);
  const el = document.getElementById(`itemAmt_${i}`);
  if (el) el.value = it.amount;
}
function addItemRow(){ editingItems.push({label:'',note:'',unitPrice:'',qty:1,extraQty:'',extraLabel:'',amount:0}); renderItemsList(); }
function removeItemRow(i){ editingItems.splice(i,1); renderItemsList(); }
function submitEvent(eventId) {
  const payload = {
    eventId: eventId || undefined,
    name: val('f_name'), date: val('f_date'), client: val('f_client'), status: val('f_status'),
    items: editingItems.filter(it => it.label || it.amount),
    discount: Number(val('f_discount')) || 0, taxRate: Number(val('f_taxRate')) || 0,
    isOverseas: document.getElementById('f_isOverseas').checked,
    invoiceNo: val('f_invoiceNo'), rmbAmount: val('f_rmbAmount') ? Number(val('f_rmbAmount')) : ''
  };
  apiPost('staffSaveEvent', payload).then(() => { closeModal(); renderEvents(); }).catch(showErr);
}
function printQuote(eventId) {
  const e = state.events.find(x => x.eventId === eventId);
  if (!e) return;
  const B = {
    accountNameEn:'DANCE SOUL', addressCn:'台灣台北市大安區仁愛路4段425-1號',
    addressEn:'NO.425-1, SECTION 4, RENAI RD., DAAN DISTRICT, TAIPEI CITY',
    bankNameCn:'永豐銀行仁愛分行', bankNameEn:'BANK SINOPAC JENAI BRANCH',
    bankAddressCn:'台灣台北市大安區仁愛路4段316-1號',
    bankAddressEn:'NO. 316-1, SEC 4, RENAI RD., DAAN DISTRICT, TAIPEI CITY, TAIWAN',
    accountNo:'160-001-0003677-8', swiftCode:'SINOTWTP'
  };
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><meta charset="utf-8"><title>${e.name} 報價單</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box;}
      @page{ size: A4; margin: 12mm; }
      body{font-family:'Noto Sans TC',sans-serif;padding:0;color:#1a1a1a;font-size:12.5px;}
      .head{display:flex;justify-content:space-between;align-items:flex-start;}
      .logo{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:1.5px;line-height:1;}
      .tagline{font-size:9px;letter-spacing:2.5px;color:#333;margin-top:2px;}
      .invoice-meta{text-align:right;font-size:12px;font-weight:700;}
      .company-name{font-size:23px;font-weight:500;margin:12px 0 6px;}
      .addr-block{font-size:11.5px;line-height:1.4;color:#333;}
      hr{border:none;border-top:1px solid #1a1a1a;margin:10px 0;}
      .meta-row{font-size:12.5px;margin:2px 0;}
      table{width:100%;border-collapse:collapse;margin-top:10px;}
      col.label{width:70%;} col.price{width:30%;}
      th{text-align:left;font-size:13px;font-weight:700;padding:5px 4px 6px;border-bottom:2px solid #c9a227;}
      td{padding:6px 4px;font-size:12.5px;}
      tbody tr:nth-child(odd){background:#fafaf7;}
      tbody tr td{border-bottom:1px solid #d8c98a;}
      td.price-cell{display:flex;justify-content:space-between;}
      .sumtable td{border:none;font-size:12.5px;}
      .sumtable tr td.slabel{text-align:right;padding-right:14px;}
      .sumtable tr td.sprice{border-bottom:1px solid #c9a227;padding:5px 4px;}
      .sumtable tr.total td{font-weight:700;}
      .sumtable tr.rmb td{background:#e6c771;font-weight:700;}
      .bank-box{border:1px solid #ccc;border-radius:4px;padding:10px 14px;margin-top:16px;font-size:10.5px;line-height:1.5;}
      .sign{text-align:center;font-size:12.5px;margin-top:16px;}
      @media print{ body{padding:0;} }
    </style></head><body>
    <div class="head">
      <div><div class="logo">DANCE SOUL</div><div class="tagline">THE PROFESSIONAL DANCE STUDIO</div></div>
      ${e.isOverseas ? `<div class="invoice-meta">Invoice# ${e.invoiceNo||''}<br>Date:${e.date||''}</div>` : ''}
    </div>
    <div class="company-name">靈動力肢體開發有限公司</div>
    <div class="addr-block">台灣 台北市大安區<br>仁愛路四段425-1號3樓<br>電話 :886-2-27512868</div>
    <hr>
    <div class="meta-row">公司名稱：${e.client||''}</div>
    <div class="meta-row">活動時間：${e.date||''}</div>
    <table>
      <colgroup><col class="label"><col class="price"></colgroup>
      <thead><tr><th>Request Payment</th><th>Price.</th></tr></thead>
      <tbody>${e.items.map(it=>{
        let breakdown = '';
        if (it.unitPrice) {
          breakdown = `$${money(it.unitPrice)}`;
          if (it.qty && it.qty != 1) breakdown += ` × ${it.qty}人`;
          if (it.extraQty) breakdown += ` × ${it.extraQty}${it.extraLabel||''}`;
        }
        return `<tr><td>${it.label}${it.note?`（${it.note}）`:''}${breakdown?` <span style="color:#888;font-size:11px;">(${breakdown})</span>`:''}</td><td><div class="price-cell"><span>NT$</span><span>${money(it.amount)}</span></div></td></tr>`;
      }).join('')}</tbody>
    </table>
    <table class="sumtable">
      <tr><td class="slabel" style="width:70%;">Subtotal</td><td class="sprice"><div class="price-cell"><span>NT$</span><span>${money(e.subtotal)}</span></div></td></tr>
      ${e.discount ? `<tr><td class="slabel">折讓</td><td class="sprice"><div class="price-cell"><span>NT$</span><span>-${money(e.discount)}</span></div></td></tr>` : ''}
      <tr><td class="slabel">Tax</td><td class="sprice"><div class="price-cell"><span></span><span>${e.tax?money(e.tax):''}</span></div></td></tr>
      <tr class="total"><td class="slabel">Total</td><td class="sprice"><div class="price-cell"><span>NT$</span><span>${money(e.total)}</span></div></td></tr>
      ${e.isOverseas ? `<tr class="rmb"><td class="slabel">換算人民幣</td><td class="sprice"><div class="price-cell"><span>CNY</span><span>${money(e.rmbAmount)}</span></div></td></tr>` : ''}
    </table>
    <div class="bank-box">
      公司名稱　　：靈動力肢體開發有限公司<br>Account Name　：${B.accountNameEn}<br>
      公司地址：${B.addressCn}<br>Beneficiary Address：${B.addressEn}<br>
      银行名称：${B.bankNameCn}<br>Bank Name：${B.bankNameEn}<br>
      银行地址：${B.bankAddressCn}<br>Bank Address：${B.bankAddressEn}<br>
      公司帳戶(Beneficiary Account No)：${B.accountNo}<br>银行國際代碼（Swift Code）：${B.swiftCode}
    </div>
    <div class="sign">主管審核 / __________________</div>
    </body></html>`);
  w.document.close(); w.print();
}

// ---------- 舞者資料 ----------
function renderDancers() {
  apiGet('staffListDancers').then(list => {
    state.dancers = list;
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <div class="toolbar"><h2>舞者資料</h2><button class="primary" onclick="openDancerForm()">＋ 新增舞者</button></div>
        <div class="field" style="margin-bottom:10px;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="showIdleDancers" style="width:auto;" onchange="renderDancersTable()"> 顯示閒置／離職</label></div>
        <div class="row" id="dancerBatchBar" style="display:none;align-items:center;background:var(--accent-soft);padding:10px 14px;border-radius:8px;margin-bottom:10px;">
          <div style="flex:1;">已選 <span id="dancerBatchCount">0</span> 位</div>
          <button class="ghost" onclick="applyBatchDancerStatus('在職')">設為在職</button>
          <button class="ghost" onclick="applyBatchDancerStatus('閒置')">設為閒置</button>
        </div>
        <div id="dancersTableWrap"></div>
      </div>`;
    renderDancersTable();
  }).catch(showErr);
}
function renderDancersTable() {
  const showIdle = document.getElementById('showIdleDancers')?.checked;
  const list = state.dancers.filter(d => showIdle || d.status === '在職');
  document.getElementById('dancersTableWrap').innerHTML = `
    <table>
      <thead><tr><th></th><th>暱稱</th><th>真實姓名</th><th>抽成比例</th><th>帳號</th><th>戶籍地址</th><th>狀態</th><th>工會投保</th><th></th></tr></thead>
      <tbody>${list.map(d => `
        <tr>
          <td><input type="checkbox" class="dancerCheck" style="width:auto;" value="${d.name}" onchange="updateDancerBatchBar()"></td>
          <td>${d.name}</td><td>${d.realName||''}</td><td>${Math.round(d.rate*100)}%</td><td>${d.account||''}</td><td>${d.address||''}</td>
          <td><span class="tag">${d.status}</span></td>
          <td>${d.exemptNhi?'<span class="tag">已投保（免扣二代健保）</span>':'—'}</td>
          <td><button class="link" onclick='openDancerForm(${JSON.stringify(d)})'>編輯</button></td>
        </tr>`).join('') || '<tr><td colspan=9 class="empty">沒有符合的舞者</td></tr>'}
      </tbody>
    </table>`;
  updateDancerBatchBar();
}
function updateDancerBatchBar() {
  const checked = document.querySelectorAll('.dancerCheck:checked');
  document.getElementById('dancerBatchBar').style.display = checked.length ? 'flex' : 'none';
  document.getElementById('dancerBatchCount').textContent = checked.length;
}
function applyBatchDancerStatus(status) {
  const names = Array.from(document.querySelectorAll('.dancerCheck:checked')).map(c => c.value);
  if (!names.length) return;
  if (!confirm(`確定把選中的 ${names.length} 位舞者都設為「${status}」？`)) return;
  apiPost('staffBatchSetDancerStatus', { names, status }).then(() => renderDancers()).catch(showErr);
}
function openDancerForm(d) {
  d = d || {};
  pendingExemptTax = !!d.exemptTax; // 這欄不開放同事編輯，只是原值原封不動存回去，避免被洗掉
  showModal(`
    <h2>${d.name ? '編輯舞者' : '新增舞者'}</h2>
    <div class="row">
      <div class="field"><label>暱稱（用來連結活動、撥款紀錄，不要隨便改）</label><input id="f_name" value="${d.name||''}"></div>
      <div class="field"><label>真實姓名（開勞務報酬單用）</label><input id="f_realName" value="${d.realName||''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>身分證字號</label><input id="f_idNumber" value="${d.idNumber||''}"></div>
      <div class="field"><label>抽成比例（0~1，例如 0.7）</label><input id="f_rate" type="number" step="0.01" value="${d.rate ?? ''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>狀態</label>
        <select id="f_status"><option ${d.status==='在職'?'selected':''}>在職</option><option ${d.status==='閒置'?'selected':''}>閒置</option><option ${d.status==='離職'?'selected':''}>離職</option></select>
      </div>
    </div>
    <div class="field"><label>匯款帳號</label><input id="f_account" value="${d.account||''}"></div>
    <div class="field"><label>戶籍地址</label><input id="f_address" value="${d.address||''}"></div>
    <div class="field" style="margin-top:4px;">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_exemptNhi" style="width:auto;" ${d.exemptNhi?'checked':''}> 已透過職業工會用這筆收入投保健保（免扣二代健保補充保費）</label>
    </div>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick='submitDancer(${JSON.stringify(d.name||'')})'>儲存</button></div>
  `);
}
function submitDancer(originalName) {
  const payload = {
    originalName,
    name: val('f_name'), realName: val('f_realName'), idNumber: val('f_idNumber'), address: val('f_address'), rate: Number(val('f_rate')), account: val('f_account'),
    status: val('f_status'),
    exemptNhi: document.getElementById('f_exemptNhi').checked,
    exemptTax: pendingExemptTax
  };
  apiPost('staffSaveDancer', payload).then(() => { closeModal(); renderDancers(); }).catch(showErr);
}

// ---------- 新增費用明細（只看得到還沒被老闆核定/填發款日期的紀錄）----------
let pendingDisbs = [];
function renderAddDisb() {
  Promise.all([apiGet('staffListEvents'), apiGet('staffListDancers'), apiGet('staffListPendingDisbursements')]).then(([events, dancers, pending]) => {
    state.events = events; state.dancers = dancers; pendingDisbs = pending;
    const eventOpts = events.map(e => `<option value="${e.eventId}">${e.name}</option>`).join('');
    const dancerOpts = dancers.filter(d => d.status === '在職').map(d => `<option value="${d.name}">${d.name}</option>`).join('');
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <h2>新增費用明細</h2>
        <div id="confirmArea"></div>
        <div class="row">
          <div class="field"><label>活動</label><select id="f_event"><option value="">— 選擇活動 —</option>${eventOpts}</select></div>
          <div class="field"><label>舞者</label><select id="f_dancer" onchange="prefillRate()"><option value="">— 選擇舞者 —</option>${dancerOpts}</select></div>
        </div>
        <div class="row">
          <div class="field"><label>授款項目</label>
            <select id="f_item" onchange="toggleItemFields()">
              ${['排練費用','舞蹈演出','彩排費用','演出費','盯場費用','其他項目','拍攝費用','教學','助教協助'].map(v=>`<option>${v}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>抽成比例（留空則帶入舞者預設值）</label><input id="f_rate" type="number" step="0.01"></div>
        </div>
        <div class="row" id="rehearsalFields">
          <div class="field"><label>排練時薪</label><input id="f_hourlyWage" type="number"></div>
          <div class="field"><label>排練時數</label><input id="f_hours" type="number"></div>
        </div>
        <div class="row" id="quoteFields">
          <div class="field"><label>原始報價</label><input id="f_originalQuote" type="number"></div>
        </div>
        <div class="field"><label>備註</label><input id="f_note"></div>
        <p style="color:var(--muted);font-size:13px;">發款日期由老闆之後在管理後台決定，這裡不用填。</p>
        <button class="primary" onclick="submitAddDisb()">送出這筆費用明細</button>
      </div>
      <div class="panel">
        <h2>待核定清單（${pending.length}）</h2>
        <p style="color:var(--muted);font-size:13px;margin-top:-8px;">這裡只會顯示「老闆還沒填發款日期」的紀錄，方便你自己核對剛登錄的有沒有錯。一旦老闆核定填了發款日期，這筆就會從這裡消失，不能再看也不能再改。</p>
        <table>
          <thead><tr><th>活動</th><th>舞者</th><th>授款項目</th><th>金額</th><th>備註</th><th></th></tr></thead>
          <tbody>${pending.map(r => `
            <tr>
              <td>${r.eventName}</td><td>${r.dancer}</td><td>${r.item}</td><td>$${money(r.actualAmount)}</td><td>${r.note||''}</td>
              <td><button class="link" onclick='openEditPending(${JSON.stringify(r)})'>編輯</button>
                  <button class="link" onclick="deletePending('${r.id}')">刪除</button></td>
            </tr>`).join('') || '<tr><td colspan=6 class="empty">目前沒有待核定的紀錄</td></tr>'}
          </tbody>
        </table>
      </div>`;
    toggleItemFields();
  }).catch(showErr);
}
function toggleItemFields() {
  const isRehearsal = val('f_item') === '排練費用';
  document.getElementById('rehearsalFields').style.display = isRehearsal ? 'flex' : 'none';
  document.getElementById('quoteFields').style.display = isRehearsal ? 'none' : 'flex';
}
function prefillRate() {
  const dancer = state.dancers.find(x => x.name === val('f_dancer'));
  if (dancer && !val('f_rate')) document.getElementById('f_rate').value = dancer.rate;
}
function submitAddDisb() {
  const eventSel = document.getElementById('f_event');
  const eventName = eventSel.options[eventSel.selectedIndex]?.text || '';
  if (!val('f_event') || !val('f_dancer')) { alert('請選擇活動和舞者'); return; }
  const payload = {
    eventId: val('f_event'), eventName, dancer: val('f_dancer'), item: val('f_item'),
    rate: val('f_rate') ? Number(val('f_rate')) : '',
    hourlyWage: Number(val('f_hourlyWage'))||'', hours: Number(val('f_hours'))||'',
    originalQuote: Number(val('f_originalQuote'))||'', note: val('f_note')
  };
  apiPost('staffAddDisbursement', payload).then(res => {
    document.getElementById('confirmArea').innerHTML = `<div class="confirm-box">已新增：${payload.dancer} / ${payload.item} — 實領金額 $${money(res.actualAmount)}</div>`;
    ['f_rate','f_hourlyWage','f_hours','f_originalQuote','f_note'].forEach(id => document.getElementById(id).value = '');
    renderAddDisb();
  }).catch(showErr);
}

// ---- 編輯／刪除待核定紀錄 ----
function openEditPending(r) {
  const eventOpts = state.events.map(e => `<option value="${e.eventId}" ${r.eventId===e.eventId?'selected':''}>${e.name}</option>`).join('');
  const dancerOpts = state.dancers.filter(d => d.status === '在職' || d.name === r.dancer)
    .map(d => `<option value="${d.name}" ${r.dancer===d.name?'selected':''}>${d.name}${d.status!=='在職'?`（${d.status}）`:''}</option>`).join('');
  showModal(`
    <h2>編輯費用明細</h2>
    <div class="row">
      <div class="field"><label>活動</label><select id="p_event">${eventOpts}</select></div>
      <div class="field"><label>舞者</label><select id="p_dancer">${dancerOpts}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>授款項目</label>
        <select id="p_item" onchange="togglePendingItemFields()">
          ${['排練費用','舞蹈演出','彩排費用','演出費','盯場費用','其他項目','拍攝費用','教學','助教協助'].map(v=>`<option ${r.item===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>抽成比例</label><input id="p_rate" type="number" step="0.01" value="${r.rate ?? ''}"></div>
    </div>
    <div class="row" id="p_rehearsalFields">
      <div class="field"><label>排練時薪</label><input id="p_hourlyWage" type="number" value="${r.hourlyWage ?? ''}"></div>
      <div class="field"><label>排練時數</label><input id="p_hours" type="number" value="${r.hours ?? ''}"></div>
    </div>
    <div class="row" id="p_quoteFields">
      <div class="field"><label>原始報價</label><input id="p_originalQuote" type="number" value="${r.originalQuote ?? ''}"></div>
    </div>
    <div class="field"><label>備註</label><input id="p_note" value="${r.note||''}"></div>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick="submitEditPending('${r.id}')">儲存</button></div>
  `);
  togglePendingItemFields();
}
function togglePendingItemFields() {
  const isRehearsal = document.getElementById('p_item').value === '排練費用';
  document.getElementById('p_rehearsalFields').style.display = isRehearsal ? 'flex' : 'none';
  document.getElementById('p_quoteFields').style.display = isRehearsal ? 'none' : 'flex';
}
function submitEditPending(id) {
  const eventSel = document.getElementById('p_event');
  const eventName = eventSel.options[eventSel.selectedIndex]?.text || '';
  const payload = {
    id, eventId: val('p_event'), eventName, dancer: val('p_dancer'), item: val('p_item'),
    rate: val('p_rate') ? Number(val('p_rate')) : '',
    hourlyWage: Number(val('p_hourlyWage'))||'', hours: Number(val('p_hours'))||'',
    originalQuote: Number(val('p_originalQuote'))||'', note: val('p_note')
  };
  apiPost('staffUpdateDisbursement', payload).then(() => { closeModal(); renderAddDisb(); }).catch(showErr);
}
function deletePending(id) {
  if (!confirm('確定刪除這筆待核定的費用明細？')) return;
  apiPost('staffDeleteDisbursement', { id }).then(renderAddDisb).catch(showErr);
}

// ---------- 啟動 ----------
renderNav();
if (API_URL.includes('PASTE_YOUR') || STAFF_TOKEN.includes('PASTE_YOUR')) {
  document.getElementById('apiStatus').textContent = '尚未設定';
  document.getElementById('main').innerHTML = '<div class="panel"><div class="empty">請先在檔案裡把 API_URL 和 STAFF_TOKEN 換成正確的值。</div></div>';
} else {
  document.getElementById('apiStatus').textContent = '已連線';
  render();
}
</script>
</body>
</html>
