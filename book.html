<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DanceSoul 課程預約</title>
<style>
  :root{
    --beige-bg: #F5EFE3;
    --beige-panel: #FBF8F1;
    --beige-line: #E4D8C0;
    --ink: #4A3F2F;
    --ink-soft: #8A7A5C;
    --accent: #B98A5A;
    --accent-soft: #E9DCC4;
    --green: #5C7A5C;
    --green-soft: #E4EEE0;
    --red: #B5674F;
    --red-soft: #F3E2DB;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    background: var(--beige-bg);
    color: var(--ink);
    line-height: 1.6;
    padding-bottom: 80px;
  }
  header{
    padding: 20px 20px 16px;
    background: var(--beige-panel);
    border-bottom: 1px solid var(--beige-line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1{
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }
  header p{
    margin: 2px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .tabs{
    display: flex;
    gap: 4px;
    margin-top: 14px;
    background: var(--beige-bg);
    border-radius: 10px;
    padding: 4px;
  }
  .tab-btn{
    flex: 1;
    padding: 9px 0;
    background: none;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab-btn.active{
    background: var(--accent);
    color: #fff;
  }
  .container{
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 16px 32px;
  }
  .panel{ display: none; }
  .panel.active{ display: block; }

  .filters{
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filters select, .filters input{
    flex-shrink: 0;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--beige-line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  .session-card{
    background: var(--beige-panel);
    border: 1px solid var(--beige-line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .session-card .top{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .session-card h3{
    margin: 0 0 4px;
    font-size: 16px;
  }
  .session-card .meta{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .badge{
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
  }
  .badge.avail{ background: var(--green-soft); color: var(--green); }
  .badge.low{ background: var(--accent-soft); color: var(--accent); }
  .badge.full{ background: var(--red-soft); color: var(--red); }
  .session-card .bottom{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .price{
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  button.book-btn{
    padding: 8px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.book-btn:disabled{
    background: var(--beige-line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .empty{
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  /* 查詢分頁 */
  .lookup-form{
    background: var(--beige-panel);
    border: 1px solid var(--beige-line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .lookup-form label{
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .lookup-form input{
    width: 100%;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--beige-line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .lookup-form button{
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .booking-row{
    background: var(--beige-panel);
    border: 1px solid var(--beige-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .booking-row .info h4{ margin: 0 0 3px; font-size: 15px; }
  .booking-row .info .meta{ font-size: 13px; color: var(--ink-soft); }
  button.cancel-btn{
    padding: 7px 14px;
    font-family: inherit;
    font-size: 13px;
    background: var(--red-soft);
    color: var(--red);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Modal */
  .modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(74,63,47,0.4);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active{ display: flex; }
  .modal{
    background: var(--beige-panel);
    border-radius: 18px 18px 0 0;
    padding: 22px 20px 28px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2{ margin: 0 0 4px; font-size: 18px; }
  .modal .modal-meta{ color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  .modal label{
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 12px 0 6px;
  }
  .modal input, .modal select{
    width: 100%;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--beige-line);
    border-radius: 8px;
  }
  .modal .btn-row{
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal .btn-row button{
    flex: 1;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .modal .btn-cancel{ background: var(--beige-bg); color: var(--ink-soft); }
  .modal .btn-confirm{ background: var(--accent); color: #fff; }
  .modal .btn-confirm:disabled{ background: var(--beige-line); color: var(--ink-soft); }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: none;
    z-index: 100;
    max-width: 90%;
    text-align: center;
  }
  .toast.ok{ background: var(--green-soft); color: var(--green); }
  .toast.bad{ background: var(--red-soft); color: var(--red); }
</style>
</head>
<body>

<header>
  <h1>DanceSoul 課程預約</h1>
  <p>選擇喜歡的課程，立即預約</p>
  <div class="tabs">
    <button class="tab-btn active" data-tab="browse">瀏覽課程</button>
    <button class="tab-btn" data-tab="mybookings">我的預約</button>
  </div>
</header>

<div class="container">

  <!-- 瀏覽課程 -->
  <div class="panel active" id="panel-browse">
    <div class="filters">
      <select id="f_course"><option value="">全部課程</option></select>
      <input type="date" id="f_startDate">
      <input type="date" id="f_endDate">
    </div>
    <div id="sessionsWrap"><div class="empty">載入中...</div></div>
  </div>

  <!-- 我的預約 -->
  <div class="panel" id="panel-mybookings">
    <div class="lookup-form">
      <label>手機號碼</label>
      <input type="text" id="lookupPhone" placeholder="請輸入預約時填寫的手機號碼">
      <button id="lookupBtn">查詢我的預約</button>
    </div>
    <div id="myBookingsWrap"></div>
  </div>

</div>

<!-- 預約 Modal -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h2 id="modalCourseName"></h2>
    <div class="modal-meta" id="modalMeta"></div>

    <label>姓名</label>
    <input type="text" id="b_name" placeholder="請輸入姓名">

    <label>手機號碼</label>
    <input type="text" id="b_phone" placeholder="請輸入手機號碼，用於查詢預約">

    <label>付款方式</label>
    <select id="b_payment">
      <option value="堂票扣抵">堂票扣抵（自動使用最早到期的堂票）</option>
      <option value="現場付款">現場付款</option>
      <option value="轉帳">轉帳</option>
    </select>

    <div class="btn-row">
      <button class="btn-cancel" id="modalCancelBtn">取消</button>
      <button class="btn-confirm" id="modalConfirmBtn">確認預約</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 部署前請把下面這行換成 Apps Script 部署後拿到的網址（結尾是 /exec）
// 這個網址是寫死在檔案裡的，因為學員是用自己的手機打開這個頁面，
// 瀏覽器不會有後台介面存過的設定。
const API_URL = 'https://script.google.com/macros/s/AKfycbzYAs1BaCUVOBrMwVMDiv84Tf3l7HkPMNBzu1EIcal1e2hSdp3mXwID1fhya4pntdBw/exec';

let sessions = [];
let courses = [];
let selectedSession = null;

function showToast(msg, ok){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'bad');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3200);
}

// ---- 防呆格式化 ----
function taipeiParts_(d){
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  return fmt.formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
}
function isRawIso_(v){ return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v); }
function fmtDate(v){
  if(!isRawIso_(v)) return v || '';
  const p = taipeiParts_(new Date(v));
  return `${p.year}/${p.month}/${p.day}`;
}
function fmtTime(v){
  if(!isRawIso_(v)) return v || '';
  const p = taipeiParts_(new Date(v));
  return `${p.hour}:${p.minute}`;
}
function weekdayLabel(dateStr){
  const parts = String(dateStr).split('/');
  if(parts.length !== 3) return '';
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- API helpers ----
async function apiGet(action, params){
  const qs = new URLSearchParams({ action, ...(params||{}) });
  const res = await fetch(API_URL + '?' + qs.toString());
  const json = await res.json();
  if(!json.success) throw new Error(json.error || '查詢失敗');
  return json.data;
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || '操作失敗');
  return json.data;
}

// ---- 瀏覽課程 ----
async function loadCourses(){
  try{
    courses = await apiGet('listCourses');
    const opts = courses.map(c => `<option value="${c['課程ID']}">${c['課程名稱']}</option>`).join('');
    document.getElementById('f_course').innerHTML = '<option value="">全部課程</option>' + opts;
  }catch(e){ /* silent */ }
}

async function loadSessions(){
  const wrap = document.getElementById('sessionsWrap');
  wrap.innerHTML = '<div class="empty">載入中...</div>';
  const params = {};
  const courseId = document.getElementById('f_course').value;
  const startDate = document.getElementById('f_startDate').value;
  const endDate = document.getElementById('f_endDate').value;
  if(courseId) params.courseId = courseId;
  if(startDate) params.startDate = startDate;
  if(endDate) params.endDate = endDate;

  try{
    sessions = await apiGet('listAvailableSessions', params);
    renderSessions();
  }catch(e){
    wrap.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function renderSessions(){
  const wrap = document.getElementById('sessionsWrap');
  if(sessions.length === 0){
    wrap.innerHTML = '<div class="empty">目前沒有開放中的場次</div>';
    return;
  }
  const sorted = [...sessions].sort((a,b) => {
    const da = String(a['日期']).replace(/\//g,'-') + ' ' + a['開始時間'];
    const db = String(b['日期']).replace(/\//g,'-') + ' ' + b['開始時間'];
    return da.localeCompare(db);
  });
  wrap.innerHTML = sorted.map((s, idx) => {
    const remaining = s['剩餘名額'];
    let badgeClass = 'avail', badgeText = remaining === null ? '名額充足' : `剩 ${remaining} 位`;
    let disabled = '';
    if(remaining !== null && remaining <= 0){ badgeClass = 'full'; badgeText = '額滿候補'; }
    else if(remaining !== null && remaining <= 3){ badgeClass = 'low'; }

    return `<div class="session-card">
      <div class="top">
        <div>
          <h3>${s['課程名稱'] || s['課程ID']}</h3>
          <div class="meta">${fmtDate(s['日期'])}（${weekdayLabel(s['日期'])}） ${fmtTime(s['開始時間'])}-${fmtTime(s['結束時間'])} · ${s['教室/場地'] || ''}</div>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="bottom">
        <span class="price">${s['堂數費用'] ? '$' + s['堂數費用'] : ''}</span>
        <button class="book-btn" data-idx="${idx}">${remaining !== null && remaining <= 0 ? '候補預約' : '立即預約'}</button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => openBookModal(sorted[Number(btn.dataset.idx)]));
  });
}

document.getElementById('f_course').addEventListener('change', loadSessions);
document.getElementById('f_startDate').addEventListener('change', loadSessions);
document.getElementById('f_endDate').addEventListener('change', loadSessions);

// ---- 預約 Modal ----
function openBookModal(session){
  selectedSession = session;
  document.getElementById('modalCourseName').textContent = session['課程名稱'] || session['課程ID'];
  document.getElementById('modalMeta').textContent =
    `${fmtDate(session['日期'])}（${weekdayLabel(session['日期'])}） ${fmtTime(session['開始時間'])}-${fmtTime(session['結束時間'])} · ${session['教室/場地'] || ''}`;
  document.getElementById('b_name').value = '';
  document.getElementById('b_phone').value = localStorage.getItem('dancesoul_last_phone') || '';
  document.getElementById('b_payment').value = '堂票扣抵';
  document.getElementById('bookModal').classList.add('active');
}
document.getElementById('modalCancelBtn').addEventListener('click', () => {
  document.getElementById('bookModal').classList.remove('active');
});

document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
  const name = document.getElementById('b_name').value.trim();
  const phone = document.getElementById('b_phone').value.trim();
  const paymentMethod = document.getElementById('b_payment').value;
  if(!name || !phone){ showToast('請填寫姓名與手機號碼', false); return; }

  const confirmBtn = document.getElementById('modalConfirmBtn');
  confirmBtn.disabled = true;
  confirmBtn.textContent = '處理中...';
  try{
    const data = await apiPost('bookSession', {
      sessionId: selectedSession['場次ID'],
      studentName: name,
      studentPhone: phone,
      paymentMethod
    });
    localStorage.setItem('dancesoul_last_phone', phone);
    document.getElementById('bookModal').classList.remove('active');
    showToast(data.bookingStatus === '候補' ? '已加入候補名單' : '預約成功！', true);
    loadSessions();
  }catch(e){
    showToast(e.message, false);
  }finally{
    confirmBtn.disabled = false;
    confirmBtn.textContent = '確認預約';
  }
});

// ---- 我的預約 ----
document.getElementById('lookupBtn').addEventListener('click', async () => {
  const phone = document.getElementById('lookupPhone').value.trim();
  const wrap = document.getElementById('myBookingsWrap');
  if(!phone){ showToast('請輸入手機號碼', false); return; }
  wrap.innerHTML = '<div class="empty">查詢中...</div>';
  try{
    const bookings = await apiGet('myBookings', { phone });
    renderMyBookings(bookings);
  }catch(e){
    wrap.innerHTML = `<div class="empty">${e.message}</div>`;
  }
});

function renderMyBookings(bookings){
  const wrap = document.getElementById('myBookingsWrap');
  const active = bookings.filter(b => b['狀態'] !== '已取消');
  if(active.length === 0){
    wrap.innerHTML = '<div class="empty">查無預約紀錄</div>';
    return;
  }
  wrap.innerHTML = active.map(b => {
    const statusBadge = b['狀態'] === '候補' ? '候補中' : (b['狀態'] === '已完成' ? '已完成' : '已預約');
    return `<div class="booking-row">
      <div class="info">
        <h4>${b['課程名稱'] || ''}</h4>
        <div class="meta">${fmtDate(b['日期'])} ${fmtTime(b['開始時間'])}-${fmtTime(b['結束時間'])} · ${statusBadge}</div>
      </div>
      ${b['狀態'] !== '已完成' ? `<button class="cancel-btn" data-id="${b['預約ID']}">取消</button>` : ''}
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('確定要取消這個預約嗎？')) return;
      try{
        await apiPost('cancelBooking', { bookingId: btn.dataset.id });
        showToast('已取消預約', true);
        document.getElementById('lookupBtn').click();
      }catch(e){ showToast(e.message, false); }
    });
  });
}

// ---- Init ----
(async function init(){
  if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('sessionsWrap').innerHTML = '<div class="empty">系統尚未設定完成，請聯繫工作室</div>';
    return;
  }
  await loadCourses();
  await loadSessions();
})();
</script>

</body>
</html>
