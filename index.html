<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞者抽成系統 — DanceSoul</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf9; --line:#e3ddcf; --ink:#2e2a24; --muted:#8a8271;
    --accent:#b5651d; --accent-soft:#e9d9c4; --good:#5b7a5a; --bad:#a4453a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  header .sub{color:var(--muted);font-size:13px;}
  nav{display:flex;gap:4px;padding:12px 24px 0;background:var(--bg);flex-wrap:wrap;}
  nav button{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:15px;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;}
  nav button.active{background:var(--panel);color:var(--ink);font-weight:700;border:1px solid var(--line);border-bottom:none;}
  main{padding:20px 24px 60px;max-width:1100px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .sumtable{width:100%;border-collapse:collapse;}
  .sumtable td{border:none;font-size:15px;padding:6px 4px;}
  .sumtable tr td.slabel{text-align:left;}
  .sumtable tr td.sprice{text-align:right;border-bottom:1px solid var(--accent);}
  .sumtable tr.total td{font-weight:700;font-size:16px;}
  .doc-logo{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:1.5px;line-height:1;}
  .doc-tagline{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:2px;margin-bottom:10px;}
  .stat{background:var(--accent-soft);border-radius:10px;padding:14px 16px;}
  .stat .label{font-size:13px;color:var(--muted);}
  .stat .value{font-size:24px;font-weight:900;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:13px;}
  tr:hover td{background:#faf7f0;}
  input,select,textarea{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:140px;}
  button.primary{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  button.ghost{background:none;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-family:inherit;cursor:pointer;color:var(--ink);}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;padding:2px 6px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  h2{font-size:16px;margin:0 0 14px;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--accent-soft);}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .item-row input{flex:1;}
  .modal-bg{position:fixed;inset:0;background:rgba(46,42,36,.4);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px;width:min(520px,92vw);max-height:88vh;overflow:auto;}
  .print-sheet{page-break-after:always;}
  @media print{ header,nav,.no-print{display:none !important;} main{padding:0;} .panel{border:none;} }
</style>
</head>
<body>

<header>
  <div>
    <h1>舞者抽成系統</h1>
    <div class="sub">靈動力肢體開發有限公司 · CASE 演出活動</div>
  </div>
  <div class="sub" id="apiStatus">連線中…</div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-bg no-print" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
// ====== 設定：貼上你部署後的 Apps Script 網頁應用程式網址 ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwI8La23JAtb2JIooIXYIln3rPPU38UO59ZyeRKx5-eBZRp_BrY2CdxKKa4ZPcqAYxE9A/exec';

const state = { tab: 'dashboard', dancers: [], events: [], disbursements: [] };

const TABS = [
  ['dashboard', '首頁'],
  ['dancers', '舞者資料'],
  ['events', '活動報價'],
  ['disbursements', '撥款明細'],
  ['remuneration', '勞務報酬單'],
  ['signing', '簽收單'],
  ['annual', '年度總表'],
  ['log', '異動紀錄'],
];

function apiGet(action, params={}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  return fetch(`${API_URL}?${qs}`).then(r => r.json()).then(r => {
    if (r.error) throw new Error(r.error);
    return r.data;
  });
}
function apiPost(action, payload) {
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, payload })
  }).then(r => r.json()).then(r => {
    if (r.error) throw new Error(r.error);
    return r.data;
  });
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(([id,label]) =>
    `<button class="${state.tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`
  ).join('');
}
function switchTab(id) { state.tab = id; renderNav(); render(); }

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">載入中…</div>';
  const renderers = { dashboard: renderDashboard, dancers: renderDancers, events: renderEvents, disbursements: renderDisbursements, remuneration: renderRemuneration, signing: renderSigning, annual: renderAnnual, log: renderLog };
  renderers[state.tab]();
}

function money(n){ return (Number(n)||0).toLocaleString('zh-TW'); }

// ---------- 首頁 ----------
function renderDashboard() {
  apiGet('dashboard').then(d => {
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <h2>本月概況（${d.thisMonth}）</h2>
        <div class="grid">
          <div class="stat"><div class="label">本月撥款筆數</div><div class="value">${d.thisMonthCount}</div></div>
          <div class="stat"><div class="label">本月撥款總額</div><div class="value">$${money(d.thisMonthTotal)}</div></div>
          <div class="stat"><div class="label">在職舞者</div><div class="value">${d.dancerCount}</div></div>
          <div class="stat"><div class="label">活動總數</div><div class="value">${d.eventCount}</div></div>
        </div>
      </div>
      <div class="panel">
        <h2>累計撥款前 10 名舞者</h2>
        <table>
          <thead><tr><th>舞者</th><th>累計實領金額</th></tr></thead>
          <tbody>${d.topDancers.map(t=>`<tr><td>${t.name}</td><td>$${money(t.total)}</td></tr>`).join('') || '<tr><td colspan=2 class="empty">尚無資料</td></tr>'}</tbody>
        </table>
      </div>`;
  }).catch(showErr);
}

// ---------- 舞者資料 ----------
function renderDancers() {
  apiGet('listDancers').then(list => {
    state.dancers = list;
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <div class="toolbar"><h2>舞者資料</h2>
          <div><button class="ghost" onclick="exportUnionList()">匯出工會投保清單</button>
          <button class="primary" onclick="openDancerForm()">＋ 新增舞者</button></div>
        </div>
        <div class="row" style="margin-bottom:10px;">
          <div class="field" style="flex:2;"><input id="dancerSearch" placeholder="搜尋暱稱／真實姓名" oninput="renderDancersTable()"></div>
          <div class="field" style="align-self:center;flex:1;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="showIdleDancers" style="width:auto;" onchange="renderDancersTable()"> 顯示閒置／離職</label></div>
        </div>
        <div id="dancersTableWrap"></div>
      </div>`;
    renderDancersTable();
  }).catch(showErr);
}
function renderDancersTable() {
  const q = (document.getElementById('dancerSearch')?.value || '').toLowerCase();
  const showIdle = document.getElementById('showIdleDancers')?.checked;
  const list = state.dancers.filter(d => {
    const matchesSearch = !q || d.name.toLowerCase().includes(q) || (d.realName||'').toLowerCase().includes(q);
    if (!matchesSearch) return false;
    if (q) return true; // 搜尋時不受閒置篩選限制，找得到人
    return showIdle || d.status === '在職';
  });
  document.getElementById('dancersTableWrap').innerHTML = `
    <table>
      <thead><tr><th>暱稱</th><th>真實姓名</th><th>身分證字號</th><th>戶籍地址</th><th>抽成比例</th><th>帳號</th><th>狀態</th><th></th></tr></thead>
      <tbody>${list.map(d => `
        <tr>
          <td>${d.name}</td><td>${d.realName||'<span style="color:var(--bad,#a4453a);">未填</span>'}</td><td>${d.idNumber||''}</td><td>${d.address||''}</td><td>${Math.round(d.rate*100)}%</td><td>${d.account||''}</td>
          <td><span class="tag">${d.status}</span>${d.exemptNhi?' <span class="tag">免二代健保</span>':''}${d.exemptTax?' <span class="tag">免所得稅</span>':''}</td>
          <td><button class="link" onclick='openDancerForm(${JSON.stringify(d)})'>編輯</button>
              <button class="link" onclick="deleteDancer('${d.name}')">刪除</button></td>
        </tr>`).join('') || '<tr><td colspan=8 class="empty">沒有符合的舞者</td></tr>'}
      </tbody>
    </table>`;
}
function exportUnionList() {
  const rows = [['暱稱','真實姓名','身分證字號','已透過工會投保(免扣二代健保)']];
  state.dancers.forEach(d => rows.push([d.name, d.realName||'', d.idNumber||'', d.exemptNhi?'是':'否']));
  downloadCsv(rows, `工會投保清單_${new Date().toISOString().slice(0,10)}.csv`);
}
function downloadCsv(rows, filename) {
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function openDancerForm(d) {
  d = d || {};
  showModal(`
    <h2>${d.name ? '編輯舞者' : '新增舞者'}</h2>
    <div class="row">
      <div class="field"><label>暱稱（用來連結活動、撥款紀錄，不要隨便改）</label><input id="f_name" value="${d.name||''}"></div>
      <div class="field"><label>真實姓名（開勞務報酬單用）</label><input id="f_realName" value="${d.realName||''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>身分證字號（開勞務報酬單用）</label><input id="f_idNumber" value="${d.idNumber||''}"></div>
      <div class="field"><label>抽成比例（0~1，例如 0.7）</label><input id="f_rate" type="number" step="0.01" value="${d.rate ?? ''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>狀態</label>
        <select id="f_status"><option ${d.status==='在職'?'selected':''}>在職</option><option ${d.status==='閒置'?'selected':''}>閒置</option><option ${d.status==='離職'?'selected':''}>離職</option></select>
      </div>
    </div>
    <div class="field"><label>匯款帳號</label><input id="f_account" value="${d.account||''}"></div>
    <div class="field"><label>戶籍地址（明年申報扣繳憑單用）</label><input id="f_address" value="${d.address||''}"></div>
    <div class="field" style="margin-top:4px;">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_exemptNhi" style="width:auto;" ${d.exemptNhi?'checked':''}> 免扣二代健保（此收入已作為職業工會健保投保金額依據）</label>
    </div>
    <div class="field" style="margin-top:4px;">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_exemptTax" style="width:auto;" ${d.exemptTax?'checked':''}> 免扣10%所得稅（例如本人是老闆、或屬於兼職所得而非執行業務所得）</label>
    </div>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick='submitDancer(${JSON.stringify(d.name||'')})'>儲存</button></div>
  `);
}
function submitDancer(originalName) {
  const payload = {
    originalName,
    name: val('f_name'), realName: val('f_realName'), idNumber: val('f_idNumber'), address: val('f_address'), rate: Number(val('f_rate')), account: val('f_account'),
    status: val('f_status'),
    exemptNhi: document.getElementById('f_exemptNhi').checked,
    exemptTax: document.getElementById('f_exemptTax').checked
  };
  apiPost('saveDancer', payload).then(() => { closeModal(); renderDancers(); }).catch(showErr);
}
function deleteDancer(name) {
  if (!confirm(`確定刪除舞者「${name}」？`)) return;
  apiPost('deleteDancer', { name }).then(renderDancers).catch(showErr);
}

// ---------- 活動報價 ----------
function renderEvents() {
  apiGet('listEvents').then(list => {
    state.events = list;
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <div class="toolbar"><h2>活動報價</h2><button class="primary" onclick="openEventForm()">＋ 新增活動</button></div>
        <div class="row" style="margin-bottom:10px;">
          <div class="field" style="flex:2;"><input id="eventSearch" placeholder="搜尋活動名稱／客戶" oninput="renderEventsTable()"></div>
          <div class="field" style="align-self:center;flex:1;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="showArchivedEvents" style="width:auto;" onchange="renderEventsTable()"> 顯示已封存</label></div>
        </div>
        <div id="eventsTableWrap"></div>
      </div>`;
    renderEventsTable();
  }).catch(showErr);
}
function renderEventsTable() {
  const q = (document.getElementById('eventSearch')?.value || '').toLowerCase();
  const showArchived = document.getElementById('showArchivedEvents')?.checked;
  let list = state.events.filter(e => {
    const archived = e.paidByClient && e.commissionPaid;
    if (archived && !showArchived) return false;
    if (q && !(e.name.toLowerCase().includes(q) || (e.client||'').toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('eventsTableWrap').innerHTML = `
    <table>
      <thead><tr><th>日期</th><th>活動名稱</th><th>客戶</th><th>總計</th><th>狀態</th><th>已收款</th><th>已付抽成</th><th></th></tr></thead>
      <tbody>${list.map(e => `
        <tr>
          <td>${e.date||''}</td><td>${e.name}</td><td>${e.client||''}</td>
          <td>$${money(e.total)}</td><td><span class="tag">${e.status}</span>${e.isOverseas?' <span class="tag">海外</span>':''}</td>
          <td><input type="checkbox" style="width:auto;" ${e.paidByClient?'checked':''} onchange="quickToggleEvent('${e.eventId}','paidByClient',this.checked)"></td>
          <td><input type="checkbox" style="width:auto;" ${e.commissionPaid?'checked':''} onchange="quickToggleEvent('${e.eventId}','commissionPaid',this.checked)"></td>
          <td><button class="link" onclick='openEventForm(${JSON.stringify(e)})'>編輯</button>
              <button class="link" onclick="printQuote('${e.eventId}')">列印報價單</button>
              <button class="link" onclick="deleteEvent('${e.eventId}')">刪除</button></td>
        </tr>`).join('') || '<tr><td colspan=8 class="empty">沒有符合的活動</td></tr>'}
      </tbody>
    </table>`;
}
function quickToggleEvent(eventId, field, value) {
  const e = state.events.find(x => x.eventId === eventId);
  if (!e) return;
  e[field] = value;
  apiPost('saveEvent', {
    eventId: e.eventId, name: e.name, date: e.date, client: e.client, status: e.status,
    items: e.items, discount: e.discount, taxRate: e.subtotal ? (e.tax / (e.subtotal - e.discount) || 0) : 0,
    isOverseas: e.isOverseas, invoiceNo: e.invoiceNo, rmbAmount: e.rmbAmount,
    paidByClient: e.paidByClient, commissionPaid: e.commissionPaid
  }).then(() => renderEventsTable()).catch(showErr);
}

let editingItems = [];
function openEventForm(e) {
  e = e || {};
  editingItems = (e.items && e.items.length) ? JSON.parse(JSON.stringify(e.items)) : [{label:'',unitPrice:'',qty:1,amount:0}];
  showModal(`
    <h2>${e.eventId ? '編輯活動' : '新增活動'}</h2>
    <div class="row">
      <div class="field"><label>活動名稱</label><input id="f_name" value="${e.name||''}"></div>
      <div class="field"><label>日期</label><input id="f_date" type="date" value="${e.date||''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>客戶</label><input id="f_client" value="${e.client||''}"></div>
      <div class="field"><label>狀態</label>
        <select id="f_status">${['報價中','已確認','已結案'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
    <label>報價項目（單價 × 人數，金額自動算）</label>
    <div id="itemsList"></div>
    <button class="ghost" onclick="addItemRow()">＋ 新增項目</button>
    <div class="row" style="margin-top:12px;">
      <div class="field"><label>折讓</label><input id="f_discount" type="number" value="${e.discount||0}"></div>
      <div class="field"><label>營業稅率（例如 0.05）</label><input id="f_taxRate" type="number" step="0.01" value="0.05"></div>
    </div>
    <div class="field" style="margin-top:8px;">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_isOverseas" style="width:auto;" ${e.isOverseas?'checked':''} onchange="toggleOverseasFields()"> 海外客戶（列印時加上 Invoice# 和人民幣換算）</label>
    </div>
    <div class="row" id="overseasFields" style="display:${e.isOverseas?'flex':'none'};">
      <div class="field"><label>Invoice #（自行填入）</label><input id="f_invoiceNo" value="${e.invoiceNo||''}"></div>
      <div class="field"><label>換算人民幣金額</label><input id="f_rmbAmount" type="number" value="${e.rmbAmount||''}"></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <div class="field"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_paidByClient" style="width:auto;" ${e.paidByClient?'checked':''}> 已收款</label></div>
      <div class="field"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_commissionPaid" style="width:auto;" ${e.commissionPaid?'checked':''}> 已付抽成</label></div>
    </div>
    <p style="color:var(--muted);font-size:13px;">兩個都勾選後，這場活動會從主列表自動收起來（列表上方「顯示已封存」可以再叫出來）。</p>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick='submitEvent(${JSON.stringify(e.eventId||'')})'>儲存</button></div>
  `);
  renderItemsList();
}
function toggleOverseasFields() {
  document.getElementById('overseasFields').style.display = document.getElementById('f_isOverseas').checked ? 'flex' : 'none';
}
function renderItemsList() {
  document.getElementById('itemsList').innerHTML = editingItems.map((it,i) => `
    <div class="item-row">
      <input placeholder="項目說明（例如：演出費）" value="${it.label||''}" onchange="editingItems[${i}].label=this.value">
      <input placeholder="單價" type="number" style="max-width:110px;" value="${it.unitPrice ?? ''}" oninput="updateItemAmount(${i}, this.value, null)">
      <span style="color:var(--muted);">×</span>
      <input placeholder="人數" type="number" style="max-width:80px;" value="${it.qty ?? 1}" oninput="updateItemAmount(${i}, null, this.value)">
      <span style="min-width:90px;text-align:right;font-weight:700;">$${money(it.amount||0)}</span>
      <button class="link" onclick="removeItemRow(${i})">✕</button>
    </div>`).join('');
}
function updateItemAmount(i, unitPrice, qty) {
  if (unitPrice !== null) editingItems[i].unitPrice = unitPrice;
  if (qty !== null) editingItems[i].qty = qty;
  editingItems[i].amount = (Number(editingItems[i].unitPrice) || 0) * (Number(editingItems[i].qty) || 0);
  renderItemsList();
}
function addItemRow(){ editingItems.push({label:'',unitPrice:'',qty:1,amount:0}); renderItemsList(); }
function removeItemRow(i){ editingItems.splice(i,1); renderItemsList(); }

function submitEvent(eventId) {
  const payload = {
    eventId: eventId || undefined,
    name: val('f_name'), date: val('f_date'), client: val('f_client'), status: val('f_status'),
    items: editingItems.filter(it => it.label || it.amount),

// ---------- 撥款明細 ----------
function renderDisbursements() {
  Promise.all([apiGet('listDisbursements'), apiGet('listEvents'), apiGet('listDancers')]).then(([disb, events, dancers]) => {
    state.disbursements = disb; state.events = events; state.dancers = dancers;
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <div class="toolbar"><h2>撥款明細</h2><button class="primary" onclick="openDisbForm()">＋ 新增撥款</button></div>
        <div class="row" style="margin-bottom:10px;">
          <div class="field" style="flex:2;"><input id="disbSearch" placeholder="搜尋活動／舞者／項目" oninput="renderDisbTable()"></div>
          <div class="field" style="align-self:center;flex:1;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="showFinalizedDisb" style="width:auto;" onchange="renderDisbTable()"> 顯示已核定（已有發款日期）</label></div>
        </div>
        <div class="row" id="batchBar" style="display:none;align-items:center;background:var(--accent-soft);padding:10px 14px;border-radius:8px;margin-bottom:10px;">
          <div style="flex:1;">已選 <span id="batchCount">0</span> 筆</div>
          <div class="field" style="max-width:180px;"><input id="batchPayDate" type="date"></div>
          <button class="primary" onclick="applyBatchPayDate()">批次填入發款日期</button>
        </div>
        <div id="disbTableWrap"></div>
      </div>`;
    renderDisbTable();
  }).catch(showErr);
}
function renderDisbTable() {
  const q = (document.getElementById('disbSearch')?.value || '').toLowerCase();
  const showFinalized = document.getElementById('showFinalizedDisb')?.checked;
  const list = state.disbursements.filter(d => {
    if (!showFinalized && d.payDate) return false;
    if (!q) return true;
    return (d.eventName||'').toLowerCase().includes(q) || (d.dancer||'').toLowerCase().includes(q) || (d.item||'').toLowerCase().includes(q);
  });
  document.getElementById('disbTableWrap').innerHTML = `
    <table>
      <thead><tr><th></th><th>發款日期</th><th>活動</th><th>舞者</th><th>授款項目</th><th>實領金額</th><th></th></tr></thead>
      <tbody>${list.map(d => `
        <tr>
          <td><input type="checkbox" class="disbCheck" style="width:auto;" value="${d.id}" onchange="updateBatchBar()"></td>
          <td>${d.payDate||''}</td><td>${d.eventName||''}</td><td>${d.dancer}</td><td>${d.item}</td>
          <td>$${money(d.actualAmount)}</td>
          <td><button class="link" onclick='openDisbForm(${JSON.stringify(d)})'>編輯</button>
              <button class="link" onclick="deleteDisb('${d.id}')">刪除</button></td>
        </tr>`).join('') || '<tr><td colspan=7 class="empty">沒有符合的紀錄</td></tr>'}
      </tbody>
    </table>`;
  updateBatchBar();
}
function updateBatchBar() {
  const checked = document.querySelectorAll('.disbCheck:checked');
  document.getElementById('batchBar').style.display = checked.length ? 'flex' : 'none';
  document.getElementById('batchCount').textContent = checked.length;
}
function applyBatchPayDate() {
  const ids = Array.from(document.querySelectorAll('.disbCheck:checked')).map(c => c.value);
  const payDate = val('batchPayDate');
  if (!ids.length || !payDate) { alert('請勾選紀錄並選擇日期'); return; }
  apiPost('batchSetPayDate', { ids, payDate }).then(() => renderDisbursements()).catch(showErr);
}

function openDisbForm(d) {
  d = d || {};
  const eventOpts = state.events.map(e => `<option value="${e.eventId}" ${d.eventId===e.eventId?'selected':''}>${e.name}</option>`).join('');
  const dancerOpts = state.dancers.filter(x => x.status === '在職' || x.name === d.dancer)
    .map(x => `<option value="${x.name}" ${d.dancer===x.name?'selected':''}>${x.name}${x.status!=='在職'?`（${x.status}）`:''}</option>`).join('');
  showModal(`
    <h2>${d.id ? '編輯撥款' : '新增撥款'}</h2>
    <div class="row">
      <div class="field"><label>活動</label><select id="f_event"><option value="">— 選擇活動 —</option>${eventOpts}</select></div>
      <div class="field"><label>舞者</label><select id="f_dancer" onchange="prefillRate()"><option value="">— 選擇舞者 —</option>${dancerOpts}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>授款項目</label>
        <select id="f_item" onchange="toggleItemFields()">
          ${['排練費用','舞蹈演出','彩排費用','演出費','盯場費用','其他項目','拍攝費用','排練費用','教學','助教協助'].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option ${d.item===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>抽成比例（留空則帶入舞者預設值）</label><input id="f_rate" type="number" step="0.01" value="${d.rate ?? ''}"></div>
    </div>
    <div class="row" id="rehearsalFields">
      <div class="field"><label>排練時薪</label><input id="f_hourlyWage" type="number" value="${d.hourlyWage ?? ''}"></div>
      <div class="field"><label>排練時數</label><input id="f_hours" type="number" value="${d.hours ?? ''}"></div>
    </div>
    <div class="row" id="quoteFields">
      <div class="field"><label>原始報價</label><input id="f_originalQuote" type="number" value="${d.originalQuote ?? ''}"></div>
    </div>
    <div class="row">
      <div class="field"><label>發款日期</label><input id="f_payDate" type="date" value="${d.payDate||''}"></div>
      <div class="field"><label>備註</label><input id="f_note" value="${d.note||''}"></div>
    </div>
    <div class="toolbar"><button class="ghost" onclick="closeModal()">取消</button>
      <button class="primary" onclick='submitDisb(${JSON.stringify(d.id||'')})'>儲存（自動計算實領金額）</button></div>
  `);
  document.getElementById('f_event').value = d.eventId || '';
  toggleItemFields();
}
function toggleItemFields() {
  const isRehearsal = val('f_item') === '排練費用';
  document.getElementById('rehearsalFields').style.display = isRehearsal ? 'flex' : 'none';
  document.getElementById('quoteFields').style.display = isRehearsal ? 'none' : 'flex';
}
function prefillRate() {
  const dancer = state.dancers.find(x => x.name === val('f_dancer'));
  if (dancer && !val('f_rate')) document.getElementById('f_rate').value = dancer.rate;
}
function submitDisb(id) {
  const eventSel = document.getElementById('f_event');
  const eventName = eventSel.options[eventSel.selectedIndex]?.text || '';
  const payload = {
    id: id || undefined,
    eventId: val('f_event'), eventName,
    dancer: val('f_dancer'), item: val('f_item'), rate: val('f_rate') ? Number(val('f_rate')) : '',
    hourlyWage: Number(val('f_hourlyWage'))||'', hours: Number(val('f_hours'))||'',
    originalQuote: Number(val('f_originalQuote'))||'', payDate: val('f_payDate'), note: val('f_note')
  };
  apiPost('saveDisbursement', payload).then(() => { closeModal(); renderDisbursements(); }).catch(showErr);
}
function deleteDisb(id) {
  if (!confirm('確定刪除這筆撥款紀錄？')) return;
  apiPost('deleteDisbursement', { id }).then(renderDisbursements).catch(showErr);
}

    }).join('') : '<div class="panel"><div class="empty">這個月沒有撥款紀錄</div></div>';
  }).catch(showErr);
}
function exportRemunerationCsv() {
  const list = state.remunList || [];
  const rows = [['月份','暱稱','真實姓名','身分證字號','給付總額','扣繳稅額','二代健保','實付淨額']];
  list.forEach(g => rows.push([g.month, g.dancer, g.realName, g.idNumber, g.gross, g.tax, g.nhi, g.net]));
  downloadCsv(rows, `勞務報酬單_${val('r_month')}.csv`);
}

// ---------- 年度總表 ----------
function renderAnnual() {
  const currentYear = new Date().getFullYear();
  document.getElementById('main').innerHTML = `
    <div class="panel no-print">
      <h2>年度總表（給明年1月申報扣繳憑單參考用）</h2>
      <div class="row">
        <div class="field"><label>年度</label><input id="annualYear" type="number" value="${currentYear}"></div>
        <div class="field" style="align-self:end;"><button class="primary" onclick="loadAnnual()">產生年度總表</button></div>
        <div class="field" style="align-self:end;"><button class="ghost" onclick="exportAnnualCsv()">匯出CSV</button></div>
      </div>
      <p style="color:var(--muted);font-size:13px;">這裡是用「全年給付總額」重新算一次扣繳稅額/二代健保，供年度彙整參考；正式申報請以每月實際扣繳金額加總為準，有落差建議跟記帳士核對。</p>
    </div>
    <div id="annualResult"></div>`;
  loadAnnual();
}
function loadAnnual() {
  const year = val('annualYear');
  apiGet('annualSummary', { year }).then(list => {
    state.annualList = list;
    document.getElementById('annualResult').innerHTML = `
      <div class="panel">
        <table>
          <thead><tr><th>暱稱</th><th>真實姓名</th><th>身分證字號</th><th>筆數</th><th>給付總額</th><th>扣繳稅額</th><th>二代健保</th><th>實付淨額</th></tr></thead>
          <tbody>${list.map(g=>`<tr><td>${g.dancer}</td><td>${g.realName||''}</td><td>${g.idNumber||''}</td><td>${g.count}</td><td>$${money(g.gross)}</td><td>$${money(g.tax)}</td><td>$${money(g.nhi)}</td><td>$${money(g.net)}</td></tr>`).join('') || '<tr><td colspan=8 class="empty">這年沒有資料</td></tr>'}</tbody>
        </table>
      </div>`;
  }).catch(showErr);
}
function exportAnnualCsv() {
  const list = state.annualList || [];
  const rows = [['暱稱','真實姓名','身分證字號','筆數','給付總額','扣繳稅額','二代健保','實付淨額']];
  list.forEach(g => rows.push([g.dancer, g.realName, g.idNumber, g.count, g.gross, g.tax, g.nhi, g.net]));
  downloadCsv(rows, `年度總表_${val('annualYear')}.csv`);
}

// ---------- 異動紀錄 ----------
function renderLog() {
  apiGet('changeLog').then(list => {
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <h2>異動紀錄（協作版最近 ${list.length} 筆操作）</h2>
        <table>
          <thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>內容</th></tr></thead>
          <tbody>${list.map(l=>`<tr><td>${l.time}</td><td>${l.actor}</td><td>${l.action}</td><td>${l.summary}</td></tr>`).join('') || '<tr><td colspan=4 class="empty">尚無紀錄</td></tr>'}</tbody>
        </table>
      </div>`;
  }).catch(showErr);
}

// ---------- 共用 ----------
function val(id){ return document.getElementById(id).value; }
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function showErr(err){ console.error(err); alert('發生錯誤：' + err.message); }

document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

// ---------- 啟動 ----------
renderNav();
if (API_URL.includes('PASTE_YOUR')) {
  document.getElementById('apiStatus').textContent = '尚未設定 API 網址';
  document.getElementById('main').innerHTML = '<div class="panel"><div class="empty">請先在 index.html 把 API_URL 換成你部署好的 Apps Script 網頁應用程式網址。</div></div>';
} else {
  document.getElementById('apiStatus').textContent = '已連線';
  render();
}
</script>
