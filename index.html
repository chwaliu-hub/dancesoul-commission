<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DanceSoul 課程預約管理系統 — 後台</title>
<style>
  :root{
    --beige-bg: #F5EFE3;
    --beige-panel: #FBF8F1;
    --beige-line: #E4D8C0;
    --ink: #4A3F2F;
    --ink-soft: #8A7A5C;
    --accent: #B98A5A;
    --accent-soft: #E9DCC4;
    --green: #5C7A5C;
    --green-soft: #E4EEE0;
    --red: #B5674F;
    --red-soft: #F3E2DB;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    background: var(--beige-bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header{
    padding: 24px 32px;
    border-bottom: 1px solid var(--beige-line);
    background: var(--beige-panel);
  }
  header h1{
    margin:0;
    font-size: 22px;
    font-weight: 700;
  }
  header p{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .container{
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 32px 64px;
  }
  .config{
    background: var(--beige-panel);
    border: 1px solid var(--beige-line);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .config label{ font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
  .config input[type=text]{ flex: 1; min-width: 260px; }
  .config .status{ font-size: 13px; padding: 4px 10px; border-radius: 20px; }
  .status.ok{ background: var(--green-soft); color: var(--green); }
  .status.bad{ background: var(--red-soft); color: var(--red); }
  .status.idle{ background: var(--accent-soft); color: var(--accent); }

  .tabs{
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--beige-line);
  }
  .tab-btn{
    padding: 10px 20px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active{
    color: var(--ink);
    font-weight: 700;
    border-bottom-color: var(--accent);
  }
  .panel{ display: none; }
  .panel.active{ display: block; }

  .card{
    background: var(--beige-panel);
    border: 1px solid var(--beige-line);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2{
    font-size: 17px;
    margin: 0 0 16px;
  }
  .card h3{
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--ink-soft);
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .field label{
    display:block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  input[type=text], input[type=number], input[type=date], input[type=time], select{
    width: 100%;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 15px;
    border: 1px solid var(--beige-line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button.primary{
    padding: 10px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.primary:hover{ opacity: 0.9; }
  button.primary:disabled{ opacity: 0.5; cursor: not-allowed; }
  button.ghost{
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid var(--beige-line);
    border-radius: 6px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  button.danger{
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    background: var(--red-soft);
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--red);
    cursor: pointer;
  }

  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td{
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--beige-line);
  }
  th{
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 13px;
  }
  tr:last-child td{ border-bottom: none; }
  .badge{
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .badge.open{ background: var(--green-soft); color: var(--green); }
  .badge.full{ background: var(--accent-soft); color: var(--accent); }
  .badge.cancel{ background: var(--red-soft); color: var(--red); }

  .filters{
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .filters .field{ min-width: 160px; }
  .empty{
    color: var(--ink-soft);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }
  .toast{
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: none;
    z-index: 100;
  }
  .toast.ok{ background: var(--green-soft); color: var(--green); }
  .toast.bad{ background: var(--red-soft); color: var(--red); }
</style>
</head>
<body>

<header>
  <h1>DanceSoul 課程預約管理系統</h1>
  <p>後台排課操作介面</p>
</header>

<div class="container">

  <div class="config">
    <label for="apiUrl">Apps Script 網址</label>
    <input type="text" id="apiUrl" placeholder="貼上部署後的 Web App 網址">
    <label for="adminPassword">管理密碼</label>
    <input type="password" id="adminPassword" placeholder="設定的管理密碼" style="max-width:160px;">
    <button class="ghost" id="saveUrlBtn">儲存</button>
    <span class="status idle" id="connStatus">尚未連線</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="courses">課程管理</button>
    <button class="tab-btn" data-tab="sessions">課表管理</button>
  </div>

  <!-- 課程管理 -->
  <div class="panel active" id="panel-courses">
    <div class="card">
      <h2>新增課程</h2>
      <div class="grid">
        <div class="field">
          <label>課程名稱</label>
          <input type="text" id="c_name" placeholder="例如：兒童芭蕾基礎班">
        </div>
        <div class="field">
          <label>類型</label>
          <select id="c_type">
            <option value="固定班表">固定班表</option>
            <option value="單堂">單堂</option>
          </select>
        </div>
        <div class="field">
          <label>所屬單位</label>
          <select id="c_unit">
            <option value="STUDIO">STUDIO</option>
            <option value="CASE">CASE</option>
            <option value="本勢娛樂">本勢娛樂</option>
          </select>
        </div>
        <div class="field">
          <label>授課老師</label>
          <select id="c_teacher"></select>
        </div>
        <div class="field">
          <label>堂數費用</label>
          <input type="number" id="c_price" placeholder="500">
        </div>
        <div class="field">
          <label>堂長（分鐘）</label>
          <input type="number" id="c_duration" placeholder="60">
        </div>
        <div class="field">
          <label>上限人數</label>
          <input type="number" id="c_capacity" placeholder="15">
        </div>
      </div>
      <button class="primary" id="addCourseBtn">新增課程</button>
    </div>

    <div class="card">
      <h2>課程清單</h2>
      <div id="coursesTableWrap"><div class="empty">尚未連線，請先貼上 Apps Script 網址</div></div>
    </div>
  </div>

  <!-- 課表管理 -->
  <div class="panel" id="panel-sessions">
    <div class="card">
      <h2>固定班表批次展開</h2>
      <h3>選好課程與星期幾、要展開幾週，按一次就自動排好未來的場次</h3>
      <div class="grid">
        <div class="field">
          <label>課程</label>
          <select id="e_course"></select>
        </div>
        <div class="field">
          <label>星期幾</label>
          <select id="e_weekday">
            <option value="0">星期日</option>
            <option value="1">星期一</option>
            <option value="2">星期二</option>
            <option value="3">星期三</option>
            <option value="4">星期四</option>
            <option value="5">星期五</option>
            <option value="6">星期六</option>
          </select>
        </div>
        <div class="field">
          <label>起始日期</label>
          <input type="date" id="e_startDate">
        </div>
        <div class="field">
          <label>開始時間</label>
          <input type="time" id="e_startTime">
        </div>
        <div class="field">
          <label>結束時間</label>
          <input type="time" id="e_endTime">
        </div>
        <div class="field">
          <label>教室/場地</label>
          <input type="text" id="e_room" placeholder="A教室">
        </div>
        <div class="field">
          <label>上限人數</label>
          <input type="number" id="e_capacity" placeholder="15">
        </div>
        <div class="field">
          <label>展開幾週</label>
          <input type="number" id="e_weeks" value="8">
        </div>
      </div>
      <button class="primary" id="expandBtn">批次展開場次</button>
    </div>

    <div class="card">
      <h2>單堂加開</h2>
      <div class="grid">
        <div class="field">
          <label>課程</label>
          <select id="s_course"></select>
        </div>
        <div class="field">
          <label>日期</label>
          <input type="date" id="s_date">
        </div>
        <div class="field">
          <label>開始時間</label>
          <input type="time" id="s_startTime">
        </div>
        <div class="field">
          <label>結束時間</label>
          <input type="time" id="s_endTime">
        </div>
        <div class="field">
          <label>教室/場地</label>
          <input type="text" id="s_room" placeholder="A教室">
        </div>
        <div class="field">
          <label>上限人數</label>
          <input type="number" id="s_capacity" placeholder="15">
        </div>
      </div>
      <button class="primary" id="addSessionBtn">加開此場次</button>
    </div>

    <div class="card">
      <h2>場次清單</h2>
      <div class="filters">
        <div class="field">
          <label>課程篩選</label>
          <select id="f_course"><option value="">全部課程</option></select>
        </div>
        <div class="field">
          <label>起始日期</label>
          <input type="date" id="f_startDate">
        </div>
        <div class="field">
          <label>結束日期</label>
          <input type="date" id="f_endDate">
        </div>
        <button class="ghost" id="filterBtn">套用篩選</button>
      </div>
      <div id="sessionsTableWrap"><div class="empty">尚未連線，請先貼上 Apps Script 網址</div></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let API_URL = localStorage.getItem('dancesoul_booking_api_url') || '';
let ADMIN_PASSWORD = localStorage.getItem('dancesoul_booking_admin_password') || '';
let courses = [];
let teachers = [];

document.getElementById('apiUrl').value = API_URL;
document.getElementById('adminPassword').value = ADMIN_PASSWORD;

function showToast(msg, ok){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'bad');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function setConn(ok, label){
  const s = document.getElementById('connStatus');
  s.textContent = label;
  s.className = 'status ' + (ok ? 'ok' : 'bad');
}

document.getElementById('saveUrlBtn').addEventListener('click', () => {
  API_URL = document.getElementById('apiUrl').value.trim();
  ADMIN_PASSWORD = document.getElementById('adminPassword').value;
  localStorage.setItem('dancesoul_booking_api_url', API_URL);
  localStorage.setItem('dancesoul_booking_admin_password', ADMIN_PASSWORD);
  refreshAll();
});

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- API helpers ----
async function apiGet(action, params){
  if(!API_URL){ setConn(false, '尚未連線'); throw new Error('尚未設定網址'); }
  const qs = new URLSearchParams({ action, ...(params||{}) });
  const res = await fetch(API_URL + '?' + qs.toString());
  const json = await res.json();
  if(!json.success) throw new Error(json.error || '查詢失敗');
  return json.data;
}

async function apiPost(action, payload){
  if(!API_URL){ setConn(false, '尚未連線'); throw new Error('尚未設定網址'); }
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, payload, adminPassword: ADMIN_PASSWORD })
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || '操作失敗');
  return json.data;
}

// ---- Load reference data ----
async function loadCourses(){
  try{
    courses = await apiGet('listCourses');
    setConn(true, '已連線');
    renderCoursesTable();
    fillCourseSelects();
  }catch(e){
    setConn(false, '連線失敗');
    document.getElementById('coursesTableWrap').innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

async function loadTeachers(){
  try{
    teachers = await apiGet('listTeachers');
    const sel = document.getElementById('c_teacher');
    sel.innerHTML = teachers.map(t => `<option value="${t['老師ID']}">${t['姓名']}</option>`).join('');
  }catch(e){ /* silent, courses load will surface connection errors */ }
}

function fillCourseSelects(){
  const opts = courses.map(c => `<option value="${c['課程ID']}">${c['課程名稱']}</option>`).join('');
  document.getElementById('e_course').innerHTML = opts;
  document.getElementById('s_course').innerHTML = opts;
  document.getElementById('f_course').innerHTML = '<option value="">全部課程</option>' + opts;
}

// ---- 防呆格式化：即使後端回傳未格式化的 ISO 字串，前端也能正常顯示 ----
function taipeiParts_(d){
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  return fmt.formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
}
function isRawIso_(v){
  return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v);
}
function fmtDate(v){
  if(!isRawIso_(v)) return v || '';
  const p = taipeiParts_(new Date(v));
  return `${p.year}/${p.month}/${p.day}`;
}
function fmtTime(v){
  if(!isRawIso_(v)) return v || '';
  const p = taipeiParts_(new Date(v));
  return `${p.hour}:${p.minute}`;
}

function renderCoursesTable(){
  const wrap = document.getElementById('coursesTableWrap');
  if(courses.length === 0){
    wrap.innerHTML = '<div class="empty">目前沒有課程，請先在上方新增</div>';
    return;
  }
  const rows = courses.map(c => {
    const teacher = teachers.find(t => t['老師ID'] === c['老師ID']);
    const badge = c['狀態'] === '開放' ? 'open' : 'cancel';
    return `<tr>
      <td>${c['課程名稱']}</td>
      <td>${c['類型']}</td>
      <td>${c['所屬單位']}</td>
      <td>${teacher ? teacher['姓名'] : c['老師ID']}</td>
      <td>$${c['堂數費用']}</td>
      <td>${c['上限人數']} 人</td>
      <td><span class="badge ${badge}">${c['狀態']}</span></td>
      <td><button class="ghost" data-toggle="${c['課程ID']}" data-status="${c['狀態'] === '開放' ? '停開' : '開放'}">${c['狀態'] === '開放' ? '停開' : '重新開放'}</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>
    <thead><tr><th>課程名稱</th><th>類型</th><th>單位</th><th>老師</th><th>費用</th><th>上限</th><th>狀態</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  wrap.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try{
        await apiPost('toggleCourse', { courseId: btn.dataset.toggle, status: btn.dataset.status });
        showToast('課程狀態已更新', true);
        loadCourses();
      }catch(e){ showToast(e.message, false); }
    });
  });
}

document.getElementById('addCourseBtn').addEventListener('click', async () => {
  const payload = {
    name: document.getElementById('c_name').value.trim(),
    type: document.getElementById('c_type').value,
    unit: document.getElementById('c_unit').value,
    teacherId: document.getElementById('c_teacher').value,
    price: Number(document.getElementById('c_price').value || 0),
    durationMin: Number(document.getElementById('c_duration').value || 0),
    capacity: Number(document.getElementById('c_capacity').value || 0),
    status: '開放'
  };
  if(!payload.name){ showToast('請輸入課程名稱', false); return; }
  try{
    await apiPost('addCourse', payload);
    showToast('課程新增成功', true);
    document.getElementById('c_name').value = '';
    document.getElementById('c_price').value = '';
    document.getElementById('c_duration').value = '';
    document.getElementById('c_capacity').value = '';
    loadCourses();
  }catch(e){ showToast(e.message, false); }
});

// ---- Sessions ----
document.getElementById('expandBtn').addEventListener('click', async () => {
  const payload = {
    courseId: document.getElementById('e_course').value,
    weekday: Number(document.getElementById('e_weekday').value),
    startDate: document.getElementById('e_startDate').value,
    startTime: document.getElementById('e_startTime').value,
    endTime: document.getElementById('e_endTime').value,
    room: document.getElementById('e_room').value.trim(),
    capacity: Number(document.getElementById('e_capacity').value || 0),
    weeks: Number(document.getElementById('e_weeks').value || 1)
  };
  if(!payload.courseId || !payload.startDate || !payload.startTime){
    showToast('請填寫課程、起始日期與開始時間', false); return;
  }
  try{
    const data = await apiPost('expandSessions', payload);
    showToast(`已展開 ${data.createdCount} 個場次`, true);
    loadSessions();
  }catch(e){ showToast(e.message, false); }
});

document.getElementById('addSessionBtn').addEventListener('click', async () => {
  const payload = {
    courseId: document.getElementById('s_course').value,
    date: document.getElementById('s_date').value,
    startTime: document.getElementById('s_startTime').value,
    endTime: document.getElementById('s_endTime').value,
    room: document.getElementById('s_room').value.trim(),
    capacity: Number(document.getElementById('s_capacity').value || 0)
  };
  if(!payload.courseId || !payload.date || !payload.startTime){
    showToast('請填寫課程、日期與開始時間', false); return;
  }
  try{
    await apiPost('addSingleSession', payload);
    showToast('已加開場次', true);
    loadSessions();
  }catch(e){ showToast(e.message, false); }
});

document.getElementById('filterBtn').addEventListener('click', loadSessions);

async function loadSessions(){
  const params = {};
  const courseId = document.getElementById('f_course').value;
  const startDate = document.getElementById('f_startDate').value;
  const endDate = document.getElementById('f_endDate').value;
  if(courseId) params.courseId = courseId;
  if(startDate) params.startDate = startDate;
  if(endDate) params.endDate = endDate;

  try{
    const sessions = await apiGet('listSessions', params);
    renderSessionsTable(sessions);
  }catch(e){
    document.getElementById('sessionsTableWrap').innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function renderSessionsTable(sessions){
  const wrap = document.getElementById('sessionsTableWrap');
  if(!sessions || sessions.length === 0){
    wrap.innerHTML = '<div class="empty">沒有符合條件的場次</div>';
    return;
  }
  const rows = sessions.map(s => {
    const course = courses.find(c => c['課程ID'] === s['課程ID']);
    const statusClass = s['狀態'] === '開放' ? 'open' : (s['狀態'] === '額滿' ? 'full' : 'cancel');
    const disableCancel = s['狀態'] === '取消';
    return `<tr>
      <td>${course ? course['課程名稱'] : s['課程ID']}</td>
      <td>${fmtDate(s['日期'])}</td>
      <td>${fmtTime(s['開始時間'])} - ${fmtTime(s['結束時間'])}</td>
      <td>${s['教室/場地'] || ''}</td>
      <td>${s['已預約人數'] ?? 0} / ${s['上限人數'] || '-'}</td>
      <td><span class="badge ${statusClass}">${s['狀態']}</span></td>
      <td>${disableCancel ? '' : `<button class="danger" data-cancel="${s['場次ID']}">取消</button>`}</td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>
    <thead><tr><th>課程</th><th>日期</th><th>時段</th><th>場地</th><th>人數</th><th>狀態</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  wrap.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('確定要取消這個場次嗎？')) return;
      try{
        await apiPost('cancelSession', { sessionId: btn.dataset.cancel });
        showToast('場次已取消', true);
        loadSessions();
      }catch(e){ showToast(e.message, false); }
    });
  });
}

async function refreshAll(){
  if(!API_URL) return;
  await loadTeachers();
  await loadCourses();
  await loadSessions();
}

refreshAll();
</script>

</body>
</html>
